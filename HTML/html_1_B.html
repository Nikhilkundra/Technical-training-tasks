<!-- More Html tags, Comments in Html, Html is not case sensitive lang. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More HTML Tags</title>
  </head>
  <body>
    <!-- This is a poem in html - comment -->
    <p>Twinkle Twinkle little star how i wonder what you are</p>
    <p>
      <b>Twinkle Twinkle </b><br />
      <i>little star</i> <br />
      <u>how i wonder</u> <br />
      what you are
    </p>
  </body>
</html>
